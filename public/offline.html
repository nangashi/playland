<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>おでかけ みつけた</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --text: #1f2328;
        --muted: #5f6b76;
        --accent: #0f6e66;
        --accent-text: #ffffff;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15181c;
          --text: #e6e8eb;
          --muted: #9aa4ae;
          --accent: #4fb8ad;
          --accent-text: #0f1512;
          color-scheme: dark;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
        text-align: center;
      }
      main {
        padding: 24px 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 17px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      button {
        font: inherit;
        padding: 8px 20px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-text);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>インターネットにつながっていません</h1>
      <p>通信できる場所で、もう一度開いてください。</p>
      <button type="button" onclick="location.reload()">再読み込み</button>
    </main>
  </body>
</html>
